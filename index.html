<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Гагик — учусь веб-разработке</title>
  <style>
    :root {
      color-scheme: light dark;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      line-height: 1.6;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #ffffff;
      color: #1d1d1f;
    }

    main {
      max-width: 640px;
      padding: 2.5rem;
      margin: 1rem;
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
    }

    h1 {
      margin-top: 0;
      font-size: 2rem;
    }

    p {
      margin-bottom: 1rem;
    }

    @media (prefers-color-scheme: dark) {
      body {
        background: #1d1d1f;
        color: #f5f5f7;
      }

      main {
        background: #2c2c2e;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      }
    }
  </style>
</head>
<body>
  <main>
    <h1>Привет, меня зовут Гагик</h1>
    <p>Я учусь веб-разработке и это моя первая страница, созданная на HTML и CSS.</p>
    <p>Здесь я тренируюсь собирать базовую структуру документа, оформлять текст и подключать стили. Дальше хочу освоить JavaScript и настоящие проекты.</p>
  </main>
</body>
</html>
